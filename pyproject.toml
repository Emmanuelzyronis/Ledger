[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "Deterministic transaction reconciliation engine"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ledger]
test-command = "PYTHONPATH=src python3 -m unittest discover -s tests -v"
check-command = "PYTHONPATH=src python3 -m compileall -q src tests"

[tool.pytest.ini_options]
pythonpath = ["src"]
